[project]
name = "claudex-setup"
version = "0.3.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "youtube-transcript-api>=1.2.4",
    # TLS/browser impersonation for the transcript fetcher's HTTP client, to get
    # past YouTube's per-IP caption-endpoint fingerprint throttle. See
    # references/transcript-fetch-throttling.md.
    "curl-cffi>=0.15.0",
]

[tool.uv]
# copy, not hard-link: `claude plugin eval` refuses a plugin dir containing any
# hard-linked file, and uv hard-links packages from its cache by default (2026-09-12)
link-mode = "copy"
